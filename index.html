<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1b1917">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RetroCam">
<title>RetroCam - live retro filter camera</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231b1917'/%3E%3Crect x='10' y='20' width='44' height='30' rx='6' fill='%23e8e0cf'/%3E%3Ccircle cx='32' cy='35' r='10' fill='%231b1917'/%3E%3Ccircle cx='32' cy='35' r='5' fill='%23ffb43a'/%3E%3Crect x='40' y='14' width='10' height='6' rx='2' fill='%23ff4633'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=Unbounded:wght@700;800&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --body:#1b1917;
  --plate:#2a2723;
  --bone:#e8e0cf;
  --dim:#a39b8b;
  --lcd:#ffb43a;
  --rec:#ff4633;
  --line:rgba(232,224,207,.14);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --f-ui:'Chakra Petch', 'Trebuchet MS', system-ui, sans-serif;
  --f-display:'Unbounded', 'Arial Black', system-ui, sans-serif;
  --f-lcd:'VT323', 'Courier New', monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--body);color:var(--bone);font-family:var(--f-ui);overscroll-behavior:none}
body{position:fixed;inset:0;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none !important}

#app{position:absolute;inset:0}
#stage{position:absolute;inset:0;background:#000}
#out{width:100%;height:100%;object-fit:contain;display:block}
#cam{position:absolute;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none}

/* ---------- top bar ---------- */
.topbar{position:absolute;z-index:6;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;
  padding:calc(var(--safe-t) + 10px) 14px 30px;background:linear-gradient(rgba(0,0,0,.65),transparent);pointer-events:none}
.topbar > *{pointer-events:auto}
.brand{font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:.01em;display:flex;align-items:center;gap:8px}
.brand i{width:9px;height:9px;border-radius:50%;background:var(--rec);display:block;box-shadow:0 0 8px var(--rec)}
.brand b{color:var(--lcd);font-weight:800}
.top-actions{display:flex;gap:8px}
.round{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(27,25,23,.6);
  border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.round[aria-pressed="true"]{background:var(--lcd);color:#1b1917;border-color:var(--lcd)}
.round svg{width:22px;height:22px}
.rec-badge{position:absolute;left:50%;top:calc(var(--safe-t) + 14px);transform:translateX(-50%);display:flex;gap:8px;align-items:center;
  background:rgba(27,25,23,.75);border:1px solid var(--rec);border-radius:999px;padding:4px 12px;font-family:var(--f-lcd);font-size:22px;line-height:1}
.rec-badge i{width:10px;height:10px;border-radius:50%;background:var(--rec);animation:blink 1s steps(2,jump-none) infinite}
@keyframes blink{50%{opacity:.15}}

/* ---------- dock ---------- */
.dock{position:absolute;z-index:6;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:12px;
  padding:26px 0 calc(var(--safe-b) + 12px);background:linear-gradient(transparent,rgba(0,0,0,.8) 38%)}
.looks{display:flex;gap:8px;overflow-x:auto;padding:2px 14px;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.looks::-webkit-scrollbar{display:none}
.look{flex:0 0 auto;width:92px;scroll-snap-align:center;padding:5px 5px 7px;border-radius:12px;text-align:center;
  background:rgba(42,39,35,.72);border:1px solid var(--line);font-size:12px;font-weight:500;line-height:1.15}
.look .sw{height:42px;border-radius:8px;margin-bottom:6px;border:1px solid rgba(255,255,255,.08)}
.look[aria-pressed="true"]{border-color:var(--lcd);background:rgba(255,180,58,.16);color:#fff}

.shutter-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 22px}
.thumb{width:48px;height:48px;border-radius:10px;border:2px solid var(--bone);background:#000 center/cover no-repeat;justify-self:start;padding:0}
.shutter{width:76px;height:76px;border-radius:50%;border:4px solid var(--bone);background:transparent;padding:5px;display:grid;place-items:center}
.shutter span{display:block;width:100%;height:100%;border-radius:50%;background:var(--bone);transition:all .16s}
.shutter.video span{background:var(--rec)}
.shutter.recording span{width:46%;height:46%;border-radius:8px;background:var(--rec)}
.seg{display:inline-flex;background:rgba(42,39,35,.8);border:1px solid var(--line);border-radius:999px;padding:3px;justify-self:end}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:999px;font-size:13px;font-weight:500;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--bone);color:#1b1917}

/* ---------- adjust panel ---------- */
.panel{display:none;margin:0 12px;padding:14px 16px 16px;border-radius:16px;max-height:40vh;overflow:auto;
  background:rgba(34,32,29,.86);border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.panel.open{display:block}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.p-name{font-family:var(--f-display);font-weight:700;font-size:14px}
.p-tag{font-size:12.5px;color:var(--dim);margin-top:3px;line-height:1.3}
.ghost{background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px}
.sliders{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}
.sl{display:block}
.sl-top{display:flex;justify-content:space-between;font-size:13px;color:var(--bone)}
.sl-top .val{font-family:var(--f-lcd);font-size:19px;line-height:1;color:var(--lcd)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;outline-offset:2px}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--lcd) var(--p,50%),rgba(232,224,207,.18) var(--p,50%))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(232,224,207,.18)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--lcd)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--bone);border:0;margin-top:-8px;box-shadow:0 1px 6px rgba(0,0,0,.6)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--bone);border:0}
.opts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.tog{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 12px;font-size:13px;color:var(--dim)}
.tog[aria-pressed="true"]{border-color:var(--lcd);color:var(--lcd)}
.opts .seg{justify-self:auto;margin-left:auto}

@media (min-width:900px){
  .panel{position:fixed;right:16px;top:70px;bottom:16px;width:330px;max-height:none;margin:0}
  .sliders{grid-template-columns:1fr}
  #app.panel-open #stage{right:346px}
  #app.panel-open .dock{right:346px}
  #app.panel-open .topbar{right:346px}
  .look{width:104px}
}

/* ---------- start screen ---------- */
.start{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:center;padding:32px calc(28px + env(safe-area-inset-left,0px));
  background:radial-gradient(120% 70% at 15% 0%,#3a2a1c 0%,var(--body) 62%)}
.bars{display:flex;height:14px;width:min(340px,72vw);margin-bottom:26px}
.bars i{flex:1;display:block}
.start h1{font-family:var(--f-display);font-weight:800;font-size:clamp(52px,15vw,112px);line-height:.92;margin:0 0 18px;letter-spacing:-.02em}
.start h1 span{color:transparent;-webkit-text-stroke:2px var(--lcd)}
.start p{max-width:34ch;margin:0 0 26px;color:var(--dim);font-size:16px;line-height:1.5}
.start .row{display:flex;flex-wrap:wrap;gap:10px}
.btn-primary{background:var(--lcd);color:#1b1917;border:0;border-radius:12px;padding:14px 22px;font-weight:600;font-size:17px}
.btn-ghost{background:transparent;border:1px solid var(--line);border-radius:12px;padding:14px 20px;font-size:16px}
.start .err{margin-top:18px;max-width:40ch;color:#ff8a7a;font-size:14px;line-height:1.45;min-height:1em}
.start small{margin-top:30px;color:var(--dim);font-size:13px;max-width:44ch;line-height:1.45}

/* ---------- preview ---------- */
.preview{position:absolute;inset:0;z-index:30;background:rgba(10,9,8,.96);display:flex;flex-direction:column}
.pv-media{flex:1;min-height:0;display:grid;place-items:center;padding:calc(var(--safe-t) + 14px) 14px 8px}
.pv-media img,.pv-media video{max-width:100%;max-height:100%;border-radius:10px;background:#000;-webkit-user-select:auto;user-select:auto}
.pv-bar{display:flex;gap:10px;justify-content:center;padding:10px 14px calc(var(--safe-b) + 16px)}
.pv-bar .btn-primary,.pv-bar .btn-ghost{padding:12px 18px;font-size:16px}

/* ---------- misc ---------- */
.toast{position:absolute;z-index:40;left:50%;top:calc(var(--safe-t) + 64px);transform:translate(-50%,-8px);background:var(--bone);color:#1b1917;
  padding:9px 14px;border-radius:10px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.flash{position:absolute;inset:0;z-index:12;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:flash .32s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
.fatal{position:absolute;inset:0;z-index:50;background:#2a0f0c;color:#ffd7d0;padding:28px;overflow:auto;font-size:14px;line-height:1.5}
.fatal pre{white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;-webkit-user-select:text;user-select:text}
:focus-visible{outline:2px solid var(--lcd);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.rec-badge i{animation:none}.flash.go{animation:none}}
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="out" width="1280" height="720"></canvas></div>
  <video id="cam" playsinline muted autoplay></video>

  <header class="topbar">
    <div class="brand"><i></i><span>Retro<b>Cam</b></span></div>
    <div class="top-actions">
      <button id="flipBtn" class="round" type="button" aria-label="Switch camera" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-9a5 5 0 0 0-5 5v1"/><path d="M17 4l3 3-3 3"/><path d="M4 17h9a5 5 0 0 0 5-5v-1"/><path d="M7 20l-3-3 3-3"/></svg>
      </button>
      <button id="adjustBtn" class="round" type="button" aria-label="Adjust settings" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h8M18 6h2M4 12h2M12 12h8M4 18h10M20 18h0"/><circle cx="15" cy="6" r="2.2"/><circle cx="9" cy="12" r="2.2"/><circle cx="17" cy="18" r="2.2"/></svg>
      </button>
    </div>
  </header>
  <div id="recBadge" class="rec-badge hidden"><i></i><span id="recTime">00:00</span></div>

  <footer class="dock">
    <aside id="panel" class="panel" aria-label="Adjustments">
      <div class="panel-head">
        <div>
          <div id="pName" class="p-name"></div>
          <div id="pTag" class="p-tag"></div>
        </div>
        <button id="resetBtn" class="ghost" type="button">Reset look</button>
      </div>
      <div id="sliders" class="sliders"></div>
      <div class="opts">
        <button id="togOverlay" class="tog" type="button" aria-pressed="true">Overlay text</button>
        <button id="togAudio" class="tog" type="button" aria-pressed="true">Record sound</button>
        <div id="qSeg" class="seg" role="group" aria-label="Render quality">
          <button type="button" data-q="960" aria-pressed="false">Fast</button>
          <button type="button" data-q="1280" aria-pressed="true">Balanced</button>
          <button type="button" data-q="1920" aria-pressed="false">Sharp</button>
        </div>
      </div>
    </aside>

    <div id="looks" class="looks" role="group" aria-label="Looks"></div>

    <div class="shutter-row">
      <button id="thumb" class="thumb hidden" type="button" aria-label="View last capture"></button>
      <button id="shutter" class="shutter" type="button" aria-label="Take photo"><span></span></button>
      <div id="modeSeg" class="seg" role="group" aria-label="Capture mode">
        <button type="button" data-m="photo" aria-pressed="true">Photo</button>
        <button type="button" data-m="video" aria-pressed="false">Video</button>
      </div>
    </div>
  </footer>

  <div id="flash" class="flash"></div>
  <div id="toast" class="toast" role="status"></div>

  <section id="start" class="start">
    <div class="bars" aria-hidden="true">
      <i style="background:#e8e0cf"></i><i style="background:#f2d13a"></i><i style="background:#2fd0d0"></i><i style="background:#39c060"></i><i style="background:#d64bb4"></i><i style="background:#e04a32"></i><i style="background:#3a55d6"></i>
    </div>
    <h1>Retro<br><span>Cam</span></h1>
    <p>Ten analog looks, applied live to your camera. Everything runs on your device and nothing is uploaded.</p>
    <div class="row">
      <button id="startBtn" class="btn-primary" type="button">Start camera</button>
      <button id="demoBtn" class="btn-ghost" type="button">Try with a demo scene</button>
    </div>
    <div id="startErr" class="err" role="alert"></div>
    <small>On iPhone, tap Share and then Add to Home Screen to run RetroCam full screen.</small>
  </section>

  <div id="preview" class="preview hidden">
    <div id="pvMedia" class="pv-media"></div>
    <div class="pv-bar">
      <button id="pvClose" class="btn-ghost" type="button">Close</button>
      <button id="pvDl" class="btn-ghost" type="button">Download</button>
      <button id="pvSave" class="btn-primary" type="button">Save or share</button>
    </div>
  </div>

  <div id="fatal" class="fatal hidden"><strong>Something went wrong</strong><pre id="fatalMsg"></pre></div>
</div>

<script>
(() => {
'use strict';

/* =====================================================================
   SHADERS
   One fragment shader holds all ten looks. uLook picks the branch.
   ===================================================================== */
const VS = `
attribute vec2 aPos;
varying vec2 vUv;
void main(){ vUv = aPos*0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }
`;

const FS = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
varying vec2 vUv;
uniform sampler2D uTex;
uniform vec2  uRes;
uniform float uTime, uLook, uIntensity, uGrain, uDistort, uBleed, uScan, uVig, uWarm, uMirror;
#define PI 3.14159265

float hash(vec2 p){
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
float vnoise(vec2 p){
  vec2 i = floor(p); vec2 f = fract(p);
  f = f*f*(3.0 - 2.0*f);
  float a = hash(i);
  float b = hash(i + vec2(1.0, 0.0));
  float c = hash(i + vec2(0.0, 1.0));
  float d = hash(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}
float frameIdx(float rate){ return mod(floor(uTime*rate), 251.0); }
float asp(){ return uRes.x / uRes.y; }

vec3 samp(vec2 uv){
  uv = 1.0 - abs(1.0 - mod(uv, 2.0));
  if(uMirror > 0.5) uv.x = 1.0 - uv.x;
  return texture2D(uTex, uv).rgb;
}
float luma(vec3 c){ return dot(c, vec3(0.299, 0.587, 0.114)); }
vec3 saturate3(vec3 c, float s){ return mix(vec3(luma(c)), c, s); }
vec3 warmth(vec3 c, float w){ return c * vec3(1.0 + 0.22*w, 1.0 + 0.04*w, 1.0 - 0.28*w); }
vec3 scurve(vec3 c, float k){ c = clamp(c, 0.0, 1.0); return mix(c, c*c*(3.0 - 2.0*c), k); }
float vignette(vec2 uv, float amt){ return 1.0 - amt * smoothstep(0.22, 0.78, length(uv - 0.5)); }
float scanl(vec2 uv, float lines, float amt){ return 1.0 - amt * (0.5 + 0.5*sin(uv.y*lines*2.0*PI)); }

vec3 rgb2yiq(vec3 c){
  return vec3(dot(c, vec3(0.299, 0.587, 0.114)), dot(c, vec3(0.596, -0.274, -0.322)), dot(c, vec3(0.211, -0.523, 0.312)));
}
vec3 yiq2rgb(vec3 c){
  return vec3(c.x + 0.956*c.y + 0.621*c.z, c.x - 0.272*c.y - 0.647*c.z, c.x - 1.106*c.y + 1.703*c.z);
}

vec3 soft(vec2 uv, float r){
  vec2 o = vec2(r, r*asp());
  vec3 c = samp(uv)*0.36;
  c += samp(uv + vec2(o.x, 0.0))*0.16;
  c += samp(uv - vec2(o.x, 0.0))*0.16;
  c += samp(uv + vec2(0.0, o.y))*0.16;
  c += samp(uv - vec2(0.0, o.y))*0.16;
  return c;
}
vec3 bloom(vec2 uv, float radius, float thresh){
  vec3 acc = vec3(0.0);
  for(int i = 0; i < 8; i++){
    float a = float(i)*0.785398;
    vec2 o = vec2(cos(a), sin(a)*asp());
    acc += max(samp(uv + o*radius) - thresh, 0.0);
    acc += max(samp(uv + o*radius*2.4) - thresh, 0.0);
  }
  return acc / 16.0;
}
float grainAt(vec2 uv, float size, float fr){
  vec2 p = uv * uRes / size;
  return (vnoise(p + fr*vec2(41.3, 27.7)) - 0.5) + (hash(p*1.7 + fr*13.1) - 0.5)*0.5;
}
/* returns (bright specks + scratches, dark specks) */
vec2 filmDamage(vec2 uv, float rate, float amt){
  float fr = frameIdx(rate);
  float a = asp();
  float bright = 0.0;
  float dark = 0.0;
  for(int i = 0; i < 2; i++){
    float fi = float(i);
    float on = step(0.6, hash(vec2(fr + fi*7.0, 3.3)));
    float x = hash(vec2(fr, 1.7 + fi));
    float w = 0.0006 + 0.0012*hash(vec2(fr, 9.1 + fi));
    float lean = (uv.y - 0.5) * 0.02 * (hash(vec2(fr, 6.6 + fi)) - 0.5);
    bright += on * smoothstep(w, 0.0, abs(uv.x - x - lean)) * (0.4 + 0.6*hash(vec2(fr, 5.5 + fi)));
  }
  for(int i = 0; i < 8; i++){
    float fi = float(i);
    vec2 p = vec2(hash(vec2(fr, fi*1.31 + 0.5)), hash(vec2(fr, fi*2.17 + 8.0)));
    float sz = 0.002 + 0.005*hash(vec2(fr, fi + 30.0));
    float on = step(0.5, hash(vec2(fr, fi + 50.0)));
    float pol = step(0.5, hash(vec2(fr, fi + 70.0)));
    float m = on * smoothstep(sz, sz*0.35, length((uv - p)*vec2(a, 1.0)));
    bright += m*pol;
    dark += m*(1.0 - pol);
  }
  return vec2(bright, dark) * amt;
}

/* ---------------- 0  Disposable camera ---------------- */
vec3 disposable(vec2 uv){
  float fr = frameIdx(8.0);
  vec2 q = uv - 0.5;
  float r2 = dot(q, q);
  uv = 0.5 + q*(1.0 + r2*0.5*uDistort);
  vec2 ab = q * 0.02 * uBleed;
  vec3 c = vec3(samp(uv + ab).r, samp(uv).g, samp(uv - ab).b);
  c = mix(c, soft(uv, 0.0016), 0.5);
  float l = luma(c);
  c = scurve(c, 0.6);
  c = saturate3(c, 1.2);
  c = c*0.92 + 0.04;
  c += (1.0 - l) * vec3(-0.015, 0.02, 0.015);
  c = warmth(c, uWarm);
  c *= 1.0 + 0.18*(1.0 - smoothstep(0.0, 0.5, length(q)));
  float leak = smoothstep(0.42, 0.0, uv.x + 0.06*sin(uTime*0.6 + uv.y*3.0));
  leak += 0.5*smoothstep(0.3, 0.0, (1.0 - uv.y) + (1.0 - uv.x)*0.6);
  c += vec3(1.0, 0.38, 0.12) * leak * (0.12 + 0.5*uBleed) * (0.6 + 0.4*sin(uTime*0.5 + 1.0));
  c += grainAt(uv, 1.6, fr) * 0.35 * uGrain * (1.2 - l);
  vec2 dm = filmDamage(uv, 8.0, uScan);
  c = mix(c, vec3(1.0), clamp(dm.x, 0.0, 1.0)*0.5);
  c = mix(c, c*0.3, clamp(dm.y, 0.0, 1.0)*0.5);
  c *= vignette(uv, uVig);
  return c;
}

/* ---------------- 1  VHS camcorder ---------------- */
vec3 vhs(vec2 uv){
  float t = uTime;
  float fr = frameIdx(30.0);
  float line = floor(uv.y * 240.0);
  float jit = (hash(vec2(line, fr)) - 0.5) * 0.006 * uDistort;
  float wob = (sin(uv.y*7.0 + t*1.7)*0.0025 + sin(uv.y*31.0 - t*4.3)*0.0008) * uDistort;
  float bandY = fract(t*0.07);
  float band = smoothstep(0.05, 0.0, abs(uv.y - bandY));
  float tear = band * (hash(vec2(line, fr + 3.0)) - 0.4) * 0.07 * uDistort;
  float hsz = smoothstep(0.07, 0.0, uv.y);
  float hs = hsz*hsz * (0.02 + 0.06*hash(vec2(line, fr + 9.0))) * uDistort * 1.5;
  uv.x += jit + wob + tear + hs;

  float bw = 0.006 + 0.02*uBleed;
  vec3 yiq = rgb2yiq(mix(samp(uv), soft(uv, 0.0016), 0.5));
  vec2 ch = vec2(0.0);
  for(int i = 0; i < 8; i++){
    float f = float(i) / 7.0;
    ch += rgb2yiq(samp(uv - vec2(f*bw*2.0 + bw*0.5, 0.0))).yz;
  }
  ch /= 8.0;
  vec3 c = yiq2rgb(vec3(yiq.x, ch*1.25));
  c = c*0.9 + vec3(0.03, 0.02, 0.05);
  c = scurve(c, 0.25);
  c = warmth(c, uWarm);
  float n = hash(vec2(uv.x*uRes.x*0.5, line) + fr*7.13);
  c += (n - 0.5) * 0.18 * uGrain;
  float n2 = hash(vec2(floor(uv.x*uRes.x/3.0), line + fr));
  c = mix(c, vec3(n2), band * 0.55 * uGrain);
  float n3 = hash(vec2(floor(uv.x*uRes.x/2.0), line + fr*2.0));
  c = mix(c, vec3(n3), clamp(hsz*hsz*uDistort*1.2, 0.0, 1.0));
  c *= scanl(uv, 240.0, uScan*0.55);
  c *= vignette(uv, uVig);
  return c;
}

/* ---------------- 2  Glitchy old TV ---------------- */
vec3 glitchtv(vec2 uv){
  float tb = mod(floor(uTime*10.0), 199.0);
  float burst = step(0.55, hash(vec2(tb, 9.1)));
  float mega = step(0.9, hash(vec2(tb, 11.3)));
  float rows = mix(20.0, 60.0, hash(vec2(tb, 2.0)));
  float row = floor(uv.y * rows);
  float hit = step(0.72, hash(vec2(row, tb + 3.0)));
  float shift = (hash(vec2(row, tb)) - 0.5) * 0.35 * uDistort * hit * burst * (1.0 + mega);
  uv.x += shift;
  vec2 blk = floor(uv * vec2(6.0, 10.0));
  float bh = step(0.93, hash(blk + tb*1.7)) * burst;
  uv.y += bh * (hash(blk + tb) - 0.5) * 0.2 * uDistort;
  uv.x += (hash(vec2(floor(uv.y*240.0), floor(uTime*30.0))) - 0.5) * 0.002 * uDistort;
  float sp = (0.003 + 0.018*burst + 0.03*mega) * uBleed * 1.5;
  vec3 c = vec3(samp(uv + vec2(sp, sp*0.3)).r, samp(uv).g, samp(uv - vec2(sp, 0.0)).b);
  float bad = step(0.965, hash(blk + tb*2.3 + 7.0)) * burst;
  c = mix(c, 1.0 - c.gbr, bad);
  float post = step(0.97, hash(blk + tb + 40.0)) * burst;
  c = mix(c, floor(c*3.0)/3.0, post);
  c = saturate3(scurve(c, 0.5), 1.3);
  c = warmth(c, uWarm);
  c += (hash(uv*uRes + tb) - 0.5) * 0.25 * uGrain * (0.4 + burst);
  float streak = step(0.985, hash(vec2(floor(uv.y*180.0), tb + 1.0))) * burst;
  c += streak * 0.4;
  c *= scanl(uv, 300.0, uScan*0.6);
  c *= vignette(uv, uVig);
  return c;
}

/* ---------------- 3  Old TV with static ---------------- */
vec3 statictv(vec2 uv){
  float t = uTime;
  float fr = frameIdx(30.0);
  uv.x += (sin(uv.y*22.0 + t*5.0)*0.003 + sin(uv.y*3.0 + t*1.3)*0.006*sin(t*0.7)) * uDistort;
  uv.y += (sin(t*0.9)*0.002 + (hash(vec2(fr, 3.0)) - 0.5)*0.004) * uDistort;
  float jump = step(0.985, hash(vec2(floor(t*6.0), 8.0)));
  uv.y = fract(uv.y + jump*0.15*uDistort);
  float sp = 0.002 + 0.008*uBleed;
  vec3 c = vec3(samp(uv + vec2(sp, 0.0)).r, samp(uv).g, samp(uv - vec2(sp, 0.0)).b);
  c = saturate3(c, 0.55);
  c = scurve(c, 0.35);
  c = warmth(c, uWarm);
  float weak = smoothstep(0.2, 1.0, sin(t*0.8)*0.5 + 0.5 + (vnoise(vec2(t*1.5, 4.0)) - 0.5)*0.6);
  float level = uGrain * (0.25 + 0.75*weak);
  vec2 px = floor(uv * uRes / 2.0);
  float snow = hash(px + fr*vec2(17.0, 31.0));
  float streak = hash(vec2(floor(uv.y*uRes.y/2.0), fr));
  float n = snow*0.8 + streak*0.2;
  c = mix(c, vec3(n), clamp(level*0.75, 0.0, 1.0));
  float barY = fract(1.0 - t*0.15);
  float bar = smoothstep(0.10, 0.0, abs(uv.y - barY));
  c *= 1.0 + bar*0.3;
  c = mix(c, vec3(hash(px + fr*5.0)), bar*0.25*(0.3 + uGrain));
  c *= 0.95 + 0.05*hash(vec2(fr, 5.0));
  c *= scanl(uv, 300.0, uScan*0.6);
  c *= vignette(uv, uVig);
  return c;
}

/* ---------------- 4  Channel bleed ---------------- */
vec3 chbleed(vec2 uv){
  float t = uTime;
  float fr = frameIdx(30.0);
  uv.x += (sin(uv.y*18.0 + t*3.0)*0.003 + sin(uv.y*2.5 - t*0.8)*0.012) * uDistort;
  float ph = fract(t*0.12);
  float roll = smoothstep(0.6, 1.0, ph) * uDistort;
  vec2 uvA = vec2(uv.x, fract(uv.y + roll));
  float seamY = fract(1.0 - roll);
  float seam = smoothstep(0.035, 0.0, abs(uv.y - seamY)) * step(0.02, roll);
  float sp = 0.004*uBleed;
  vec3 A = vec3(samp(uvA + vec2(sp, 0.0)).r, samp(uvA).g, samp(uvA - vec2(sp, 0.0)).b);

  vec2 uvB = (uv - 0.5)*1.35 + 0.5;
  uvB.x = 1.0 - uvB.x + t*0.02;
  uvB.y = uvB.y + t*0.03;
  vec3 B = samp(uvB);
  B = mix(vec3(luma(B)), B, 0.5) * vec3(1.05, 0.55, 1.15);

  float bands = sin(uv.y*5.0 + t*0.7 + sin(uv.y*14.0 - t*1.3)*1.4);
  float ragged = (vnoise(vec2(uv.y*60.0, floor(t*15.0))) - 0.5)*0.35;
  float m = smoothstep(-0.1, 0.6, bands*0.6 + 0.4*sin(t*0.5) + ragged);
  m *= smoothstep(0.0, 0.8, uv.x + 0.35*sin(t*0.3));
  vec3 c = mix(A, B, m * uBleed * 0.9);

  vec3 ghost = samp(uvA - vec2(0.045, 0.0));
  c = mix(c, ghost, 0.3*uBleed);
  c = saturate3(c, 0.9);
  c = warmth(c, uWarm);
  c += (hash(uv*uRes*0.5 + fr*3.1) - 0.5) * 0.2 * uGrain;
  c += 0.03 * uBleed * sin(uv.y*420.0 + uv.x*60.0 + t*20.0);
  c = mix(c, vec3(0.02), seam);
  c *= scanl(uv, 280.0, uScan*0.6);
  c *= vignette(uv, uVig);
  return c;
}

/* ---------------- 5  35mm film ---------------- */
vec3 film35(vec2 uv){
  float fr = frameIdx(24.0);
  vec2 weave = (vec2(hash(vec2(fr, 1.0)), hash(vec2(fr, 2.0))) - 0.5) * 0.0025 * uDistort
             + vec2(sin(uTime*0.9), cos(uTime*0.7)) * 0.0015 * uDistort;
  uv += weave;
  vec2 q = uv - 0.5;
  vec2 ab = q * 0.012 * uBleed;
  vec3 c = vec3(samp(uv + ab).r, samp(uv).g, samp(uv - ab).b);
  c = mix(c, soft(uv, 0.0012), 0.35);
  c *= 1.0 + (hash(vec2(fr, 7.7)) - 0.5) * 0.06 * (0.3 + uDistort);
  c += bloom(uv, 0.010, 0.55) * vec3(1.6, 0.55, 0.25) * (0.6 + 0.8*uBleed);
  float l = luma(c);
  c = scurve(c, 0.45);
  c = saturate3(c, 0.92);
  c = c*0.94 + vec3(0.02, 0.025, 0.03);
  c = mix(c, c*vec3(0.92, 1.0, 1.06), (1.0 - l)*0.5);
  c = mix(c, c*vec3(1.08, 1.0, 0.9), l*0.5);
  c = warmth(c, uWarm);
  c += grainAt(uv, 1.3, fr) * 0.32 * uGrain * (0.45 + 0.9*(1.0 - l));
  vec2 dm = filmDamage(uv, 12.0, uScan);
  c = mix(c, vec3(1.0), clamp(dm.x, 0.0, 1.0)*0.55);
  c = mix(c, c*0.25, clamp(dm.y, 0.0, 1.0)*0.6);
  c *= vignette(uv, uVig);
  return c;
}

/* ---------------- 6  Super 8 ---------------- */
vec3 super8(vec2 uv){
  float fr = frameIdx(18.0);
  vec2 j = (vec2(hash(vec2(fr, 1.3)), hash(vec2(fr, 2.3))) - 0.5) * 0.008 * uDistort;
  float slip = step(0.965, hash(vec2(fr, 4.4))) * (hash(vec2(fr, 5.5)) - 0.5) * 0.08 * uDistort;
  uv += j + vec2(0.0, slip);
  vec2 q = uv - 0.5;
  vec2 ab = q * 0.02 * uBleed;
  vec3 c = vec3(samp(uv + ab).r, samp(uv).g, samp(uv - ab).b);
  c = mix(c, soft(uv, 0.0022), 0.6);
  c *= 1.0 + (hash(vec2(fr, 6.6)) - 0.5) * 0.22;
  c = scurve(c, 0.5);
  c = saturate3(c, 1.25);
  c *= vec3(1.06, 1.0, 0.86);
  c = c*0.9 + vec3(0.07, 0.04, 0.02);
  c = warmth(c, uWarm);
  float lk = step(0.82, hash(vec2(floor(uTime*0.6), 8.8)));
  float edge = smoothstep(0.35, 0.0, uv.x) + smoothstep(0.75, 1.0, uv.x)*0.3;
  c += vec3(1.0, 0.3, 0.05) * edge * lk * (0.3 + 0.5*uBleed) * (0.5 + 0.5*hash(vec2(fr, 9.9)));
  c += grainAt(uv, 2.4, fr) * 0.6 * uGrain;
  vec2 dm = filmDamage(uv, 9.0, uScan);
  c = mix(c, vec3(1.0), clamp(dm.x, 0.0, 1.0)*0.5);
  c = mix(c, c*0.3, clamp(dm.y, 0.0, 1.0)*0.55);
  c *= vignette(uv, uVig);
  return c;
}

/* ---------------- 7  CRT monitor ---------------- */
vec3 crt(vec2 uv){
  float t = uTime;
  vec2 q = uv*2.0 - 1.0;
  float k = 0.04 + 0.22*uDistort;
  q *= 1.0 + vec2(q.y*q.y, q.x*q.x)*k;
  vec2 w = q*0.5 + 0.5;
  float rows = 300.0;
  vec2 pu = vec2(w.x, (floor(w.y*rows) + 0.5)/rows);
  vec2 dc = (w - 0.5) * 0.01 * uBleed;
  vec3 c = vec3(samp(pu + dc).r, samp(pu).g, samp(pu - dc).b);
  vec3 hb = (samp(pu + vec2(0.0018, 0.0)) + samp(pu - vec2(0.0018, 0.0))) * 0.5;
  c = mix(c, hb, 0.3);
  c += bloom(pu, 0.006, 0.55) * 1.3;
  float sl = 0.5 + 0.5*sin(w.y*rows*2.0*PI - PI*0.5);
  c *= 1.0 - uScan*0.6*(1.0 - sl);
  float m3 = mod(floor(w.x*uRes.x/2.0), 3.0);
  vec3 mk = 0.65 + 0.7*vec3(float(m3 < 0.5), float(m3 > 0.5 && m3 < 1.5), float(m3 > 1.5));
  c *= mix(vec3(1.0), mk, 0.5*uScan);
  c *= 1.0 + 0.25*uScan;
  c *= 1.0 + 0.06*smoothstep(0.15, 0.0, abs(w.y - fract(1.0 - t*0.08)));
  c *= 1.0 - 0.05*uDistort*hash(vec2(frameIdx(30.0), 1.0));
  c += (hash(w*uRes + frameIdx(30.0)) - 0.5) * 0.12 * uGrain;
  c = saturate3(scurve(c, 0.3), 1.15);
  c = warmth(c, uWarm);
  c *= vignette(w, uVig);
  float edge = smoothstep(0.0, 0.012, min(min(w.x, 1.0 - w.x), min(w.y, 1.0 - w.y)));
  return c*edge;
}

/* ---------------- 8  Security cam ---------------- */
vec3 seccam(vec2 uv){
  float t = uTime;
  float fr = frameIdx(15.0);
  vec2 q = uv - 0.5;
  float r2 = dot(q, q);
  uv = 0.5 + q*(1.0 - r2*0.8*uDistort);
  float line = floor(uv.y*200.0);
  uv.x += (hash(vec2(line, fr)) - 0.5) * 0.004 * uDistort;
  vec2 grid = vec2(200.0*asp(), 200.0);
  vec2 pu = (floor(uv*grid) + 0.5) / grid;
  float sp = 0.003*uBleed;
  vec3 c = vec3(samp(pu + vec2(sp, 0.0)).r, samp(pu).g, samp(pu - vec2(sp, 0.0)).b);
  vec2 blk = floor(uv * vec2(14.0*asp(), 14.0));
  c += (hash(blk + floor(t*2.0)) - 0.5) * 0.06 * uGrain;
  float l = luma(c);
  l = clamp((l - 0.5)*1.4 + 0.52, 0.0, 1.0);
  float w = uWarm*0.5 + 0.5;
  vec3 tintG = vec3(0.50, 1.00, 0.58);
  vec3 tintN = vec3(0.93, 0.98, 1.00);
  vec3 tintA = vec3(1.00, 0.80, 0.52);
  vec3 tint = w < 0.5 ? mix(tintG, tintN, w*2.0) : mix(tintN, tintA, (w - 0.5)*2.0);
  vec3 col = vec3(l) * tint;
  col *= 1.0 + 0.2*(1.0 - smoothstep(0.0, 0.5, length(q)));
  col += (hash(uv*uRes*0.6 + fr*3.7) - 0.5) * 0.28 * uGrain;
  float bandY = fract(1.0 - t*0.1);
  float band = smoothstep(0.08, 0.0, abs(uv.y - bandY));
  col += band * (hash(vec2(line, fr)) - 0.35) * 0.3 * uGrain;
  col *= scanl(uv, 200.0, uScan*0.5);
  col *= vignette(uv, uVig);
  return col;
}

/* ---------------- 9  Silent film ---------------- */
vec3 silent(vec2 uv){
  float fr = frameIdx(16.0);
  vec2 j = (vec2(hash(vec2(fr, 1.1)), hash(vec2(fr, 2.2))) - 0.5) * 0.01 * uDistort;
  float slip = step(0.95, hash(vec2(fr, 3.3))) * (hash(vec2(fr, 4.4)) - 0.5) * 0.06 * uDistort;
  uv += j + vec2(0.0, slip);
  vec3 c0 = mix(samp(uv), soft(uv, 0.0018), 0.55);
  float l = dot(c0, vec3(0.22, 0.60, 0.30));
  l *= 1.0 + ((hash(vec2(fr, 6.1)) - 0.5)*0.35 + 0.06*sin(uTime*13.0)) * (0.4 + 0.6*uDistort);
  l = clamp((l - 0.45)*1.35 + 0.5, 0.0, 1.0);
  l += luma(bloom(uv, 0.008, 0.6)) * 1.5;
  vec3 silver = vec3(0.88, 0.94, 1.00);
  vec3 sepia = vec3(1.08, 0.88, 0.62);
  vec3 tint = mix(silver, sepia, uWarm*0.5 + 0.5);
  vec3 c = vec3(l) * tint;
  c = c*0.95 + 0.03;
  c += grainAt(uv, 1.8, fr) * 0.4 * uGrain;
  vec2 dm = filmDamage(uv, 12.0, uScan);
  c = mix(c, vec3(1.0), clamp(dm.x, 0.0, 1.0)*0.8);
  c = mix(c, vec3(0.03), clamp(dm.y, 0.0, 1.0)*0.85);
  c *= vignette(uv, uVig);
  return c;
}

void main(){
  vec2 uv = vUv;
  vec3 orig = samp(uv);
  vec3 c;
  float L = uLook;
  if(L < 0.5)      c = disposable(uv);
  else if(L < 1.5) c = vhs(uv);
  else if(L < 2.5) c = glitchtv(uv);
  else if(L < 3.5) c = statictv(uv);
  else if(L < 4.5) c = chbleed(uv);
  else if(L < 5.5) c = film35(uv);
  else if(L < 6.5) c = super8(uv);
  else if(L < 7.5) c = crt(uv);
  else if(L < 8.5) c = seccam(uv);
  else             c = silent(uv);
  c = mix(orig, c, uIntensity);
  gl_FragColor = vec4(clamp(c, 0.0, 1.0), 1.0);
}
`;

    if(s.tweaks) state.tweaks = LOOKS.map((l, i) => Object.assign({}, l.d, s.tweaks[i] || {}));
    if(typeof s.overlay === 'boolean') state.overlay = s.overlay;
    if(typeof s.audio === 'boolean') state.audio = s.audio;
    if([960,1280,1920].includes(s.quality)) state.quality = s.quality;
  }catch(e){}
}
function savePrefs(){
  try{ localStorage.setItem(KEY, JSON.stringify({look:state.look, tweaks:state.tweaks, overlay:state.overlay, audio:state.audio, quality:state.quality})); }catch(e){}
}

function fatal(msg){
  $('#fatalMsg').textContent = msg;
  $('#fatal').classList.remove('hidden');
  console.error(msg);
}
let toastTimer;
function toast(msg, ms = 2600){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}

/* =====================================================================
   WEBGL
   ===================================================================== */
const octx = out.getContext('2d', { alpha:false });
const glc = document.createElement('canvas');
glc.width = out.width; glc.height = out.height;
const gl = glc.getContext('webgl', { alpha:false, antialias:false, premultipliedAlpha:false, preserveDrawingBuffer:false, powerPreference:'high-performance' })
        || glc.getContext('experimental-webgl');
if(!gl){ fatal('WebGL is not available in this browser, so the filters cannot run.'); return; }

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
let prog;
try{
  prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
}catch(e){ fatal('Shader compile error:\n\n' + e.message); return; }
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'aPos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const tex = gl.createTexture();
gl.activeTexture(gl.TEXTURE0);
gl.bindTexture(gl.TEXTURE_2D, tex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);

const U = {};
['uTex','uRes','uTime','uLook','uIntensity','uGrain','uDistort','uBleed','uScan','uVig','uWarm','uMirror']
  .forEach(n => U[n] = gl.getUniformLocation(prog, n));
gl.uniform1i(U.uTex, 0);

/* =====================================================================
   DEMO SOURCE (used when no camera is available)
   ===================================================================== */
const demo = document.createElement('canvas');
demo.width = 1280; demo.height = 720;
const dctx = demo.getContext('2d');
function drawDemo(t){
  const g = dctx.createLinearGradient(0, 0, 0, 720);
  g.addColorStop(0, '#3a6ea5'); g.addColorStop(.55, '#f2b880'); g.addColorStop(1, '#7a4b3a');
  dctx.fillStyle = g; dctx.fillRect(0, 0, 1280, 720);
  dctx.fillStyle = '#fff3c4';
  dctx.beginPath(); dctx.arc(900 + Math.sin(t*.4)*70, 200, 90, 0, 7); dctx.fill();
  dctx.fillStyle = '#2e4a3a';
  dctx.beginPath(); dctx.moveTo(0, 720);
  for(let x = 0; x <= 1280; x += 40) dctx.lineTo(x, 500 + Math.sin(x*.006 + t*.3)*50 + Math.sin(x*.02)*14);
  dctx.lineTo(1280, 720); dctx.fill();
  const cols = ['#e04a32', '#f2d13a', '#2fd0d0', '#d64bb4', '#ffffff'];
  for(let i = 0; i < 5; i++){
    dctx.fillStyle = cols[i];
    const x = 640 + Math.sin(t*.7 + i*1.3)*420, y = 360 + Math.cos(t*.9 + i*2.1)*170, r = 40 + i*10;
    dctx.beginPath(); dctx.arc(x, y, r, 0, 7); dctx.fill();
  }
  dctx.fillStyle = '#fff';
  dctx.fillRect(((t*220) % 1500) - 110, 610, 110, 60);
  const bars = ['#e8e0cf','#f2d13a','#2fd0d0','#39c060','#d64bb4','#e04a32','#3a55d6'];
  bars.forEach((b, i) => { dctx.fillStyle = b; dctx.fillRect(i*(1280/7), 0, 1280/7 + 1, 70); });
  dctx.fillStyle = '#111'; dctx.font = 'bold 64px Arial, sans-serif'; dctx.textAlign = 'center';
  dctx.fillText('DEMO SCENE', 640, 330);
}

/* =====================================================================
   RENDER LOOP
   ===================================================================== */
let running = false, tAcc = 0, lastT = 0;

function fitCanvas(sw, sh){
  if(state.recording) return;
  const scale = Math.min(1, state.quality / Math.max(sw, sh));
  const w = Math.max(2, Math.round(sw*scale/2)*2);
  const h = Math.max(2, Math.round(sh*scale/2)*2);
  if(out.width !== w || out.height !== h){
    out.width = w; out.height = h;
    glc.width = w; glc.height = h;
    gl.viewport(0, 0, w, h);
  }
}

function loop(now){
  requestAnimationFrame(loop);
  if(!running || now - lastT < 30) return;
  const dt = Math.min((now - lastT)/1000, 0.1);
  lastT = now;
  const v = V();
  tAcc = (tAcc + dt * v.speed/100) % 3600;

  let src, sw, sh;
  if(state.source === 'demo'){ drawDemo(now/1000); src = demo; sw = 1280; sh = 720; }
  else{
    if(video.readyState < 2 || !video.videoWidth) return;
    src = video; sw = video.videoWidth; sh = video.videoHeight;
  }
  fitCanvas(sw, sh);

  try{
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, src);
  }catch(e){ return; }

  gl.uniform2f(U.uRes, glc.width, glc.height);
  gl.uniform1f(U.uTime, tAcc);
  gl.uniform1f(U.uLook, state.look);
  gl.uniform1f(U.uIntensity, v.intensity/100);
  gl.uniform1f(U.uGrain, v.grain/100);
  gl.uniform1f(U.uDistort, v.distort/100);
  gl.uniform1f(U.uBleed, v.bleed/100);
  gl.uniform1f(U.uScan, v.scan/100);
  gl.uniform1f(U.uVig, v.vig/100);
  gl.uniform1f(U.uWarm, v.warm/100);
  gl.uniform1f(U.uMirror, state.mirror ? 1 : 0);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  octx.drawImage(glc, 0, 0, out.width, out.height);
  drawOverlay(out.width, out.height, now);
}

/* =====================================================================
   ON-SCREEN TEXT (baked into photos and videos)
   ===================================================================== */
const MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const p2 = n => String(n).padStart(2, '0');

function drawOverlay(w, h, nowMs){
  if(!state.overlay) return;
  const id = state.look;
  if(![0,1,2,3,4,8].includes(id)) return;
  const c = octx, u = Math.min(w, h)/720, d = new Date();
  const blink = Math.floor(nowMs/500) % 2 === 0;
  const jit = (Math.random() - .5) * 2 * u * (V().distort/100) * (id === 1 || id === 2 ? 1 : 0);
  const F = px => `${Math.round(px*u)}px VT323, "Courier New", monospace`;
  const txt = (s, x, y, color, size, align, glow) => {
    c.font = F(size); c.textAlign = align || 'left';
    c.shadowColor = glow || 'rgba(0,0,0,.7)'; c.shadowBlur = (glow ? 9 : 4)*u;
    c.fillStyle = color; c.fillText(s, x, y);
  };
  const dot = (x, y, r, color) => { c.shadowBlur = 8*u; c.shadowColor = color; c.fillStyle = color; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill(); };
  c.save();
  const m = 40*u;

  if(id === 0){
    const s = `'${p2(d.getFullYear() % 100)}  ${d.getMonth()+1}  ${p2(d.getDate())}`;
    txt(s, w - m, h - m, '#ff8a1f', 44, 'right', 'rgba(255,110,0,.9)');
  }
  else if(id === 1){
    if(blink) dot(m + 10*u + jit, m + 6*u, 9*u, '#ff3b2f');
    txt('REC', m + 30*u + jit, m + 20*u, '#ffffff', 44);
    // battery
    c.shadowBlur = 3*u; c.shadowColor = 'rgba(0,0,0,.7)';
    c.strokeStyle = '#fff'; c.lineWidth = 2.5*u;
    c.strokeRect(w - m - 54*u + jit, m - 10*u, 46*u, 22*u);
    c.fillStyle = '#fff'; c.fillRect(w - m - 8*u + jit, m - 4*u, 4*u, 10*u);
    for(let i = 0; i < 3; i++) c.fillRect(w - m - 50*u + i*14*u + jit, m - 6*u, 11*u, 14*u);
    txt('SP', w - m - 66*u + jit, m + 14*u, '#ffffff', 40, 'right');
    const h12 = d.getHours() % 12 || 12;
    txt(`${MON[d.getMonth()]}. ${p2(d.getDate())} ${d.getFullYear()}`, m + jit, h - m - 36*u, '#ffffff', 40);
    txt(`${h12}:${p2(d.getMinutes())} ${d.getHours() < 12 ? 'AM' : 'PM'}`, m + jit, h - m, '#ffffff', 40);
  }
  else if(id === 2){
    c.shadowBlur = 6*u; c.shadowColor = 'rgba(0,0,0,.7)'; c.fillStyle = '#fff';
    c.beginPath(); c.moveTo(m + jit, m - 22*u); c.lineTo(m + 20*u + jit, m - 8*u); c.lineTo(m + jit, m + 6*u); c.closePath(); c.fill();
    txt('PLAY', m + 30*u + jit, m + 10*u, '#ffffff', 44);
  }
  else if(id === 3){
    txt('CH 03', w - m, m + 24*u, '#5dff7a', 68, 'right', 'rgba(60,255,110,.9)');
  }
  else if(id === 4){
    const ch = (Math.floor(nowMs/3000) % 3 === 2) ? '04' : '03';
    txt('CH ' + ch, w - m, m + 24*u, '#5dff7a', 68, 'right', 'rgba(60,255,110,.9)');
  }
  else if(id === 8){
    txt('CAM 01', m, m + 16*u, '#e8ffe8', 44);
    if(blink) dot(m + 10*u, h - m - 8*u, 9*u, '#ff3b2f');
    txt('REC', m + 28*u, h - m, '#e8ffe8', 40);
    txt(`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`, w - m, m + 16*u, '#e8ffe8', 40, 'right');
    txt(`${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`, w - m, m + 50*u, '#e8ffe8', 40, 'right');
  }
  c.restore();
}

/* =====================================================================
   CAMERA
   ===================================================================== */
let stream = null;
function stopStream(){
  if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.srcObject = null;
}
async function startCamera(){
  stopStream();
  stream = await navigator.mediaDevices.getUserMedia({
    audio: false,
    video: { facingMode: { ideal: state.facing }, width: { ideal: 1280 }, height: { ideal: 720 } }
  });
  video.srcObject = stream;
  await video.play();
  const st = stream.getVideoTracks()[0].getSettings();
  state.mirror = st.facingMode ? st.facingMode === 'user' : (state.facing === 'user' || !isMobile);
  try{
    const devs = await navigator.mediaDevices.enumerateDevices();
    $('#flipBtn').hidden = devs.filter(d => d.kind === 'videoinput').length < 2;
  }catch(e){}
}
function cameraError(e){
  let m = 'The camera could not be started.';
  if(e && e.name === 'NotAllowedError') m = 'Camera access was blocked. Allow the camera for this site in your browser or system settings, then tap Start camera again.';
  else if(e && e.name === 'NotFoundError') m = 'No camera was found on this device. You can still try the demo scene.';
  else if(e && e.name === 'NotReadableError') m = 'Another app is using the camera. Close it and try again.';
  else if(e && e.message) m += ' (' + e.message + ')';
  $('#startErr').textContent = m;
}

/* =====================================================================
   UI
   ===================================================================== */
const looksEl = $('#looks'), slidersEl = $('#sliders'), panel = $('#panel');
const sliderEls = {};

LOOKS.forEach((l, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'look'; b.setAttribute('aria-pressed', 'false');
  b.innerHTML = `<div class="sw" style="background:${l.sw}"></div><span>${l.name}</span>`;
  b.addEventListener('click', () => selectLook(i));
  looksEl.appendChild(b);
});

const fmt = (s, v) => s.k === 'warm' ? (v > 0 ? '+' : '') + v : s.unit ? v + s.unit : String(v);
function setFill(inp){ inp.style.setProperty('--p', ((inp.value - inp.min) / (inp.max - inp.min) * 100) + '%'); }

SLIDERS.forEach(s => {
  const wrap = document.createElement('label');
  wrap.className = 'sl';
  wrap.innerHTML = `<span class="sl-top"><span>${s.label}</span><span class="val"></span></span>
    <input type="range" min="${s.min}" max="${s.max}" step="1">`;
  const inp = wrap.querySelector('input'), val = wrap.querySelector('.val');
  inp.addEventListener('input', () => {
    V()[s.k] = +inp.value;
    val.textContent = fmt(s, +inp.value);
    setFill(inp);
    savePrefs();
  });
  sliderEls[s.k] = { inp, val, s };
  slidersEl.appendChild(wrap);
});

function refreshSliders(){
  const v = V();
  SLIDERS.forEach(s => {
    const e = sliderEls[s.k];
    e.inp.value = v[s.k];
    e.val.textContent = fmt(s, v[s.k]);
    setFill(e.inp);
  });
}
function selectLook(i){
  state.look = i;
  [...looksEl.children].forEach((b, j) => b.setAttribute('aria-pressed', j === i ? 'true' : 'false'));
  looksEl.children[i].scrollIntoView({ inline:'center', block:'nearest', behavior:'smooth' });
  $('#pName').textContent = LOOKS[i].name;
  $('#pTag').textContent = LOOKS[i].tag;
  refreshSliders();
  savePrefs();
}
$('#resetBtn').addEventListener('click', () => {
  state.tweaks[state.look] = Object.assign({}, LOOKS[state.look].d);
  refreshSliders(); savePrefs();
});

function setPanel(open){
  panel.classList.toggle('open', open);
  app.classList.toggle('panel-open', open);
  $('#adjustBtn').setAttribute('aria-pressed', open ? 'true' : 'false');
}
$('#adjustBtn').addEventListener('click', () => setPanel(!panel.classList.contains('open')));

const togOverlay = $('#togOverlay'), togAudio = $('#togAudio');
function syncToggles(){
  togOverlay.setAttribute('aria-pressed', state.overlay);
  togAudio.setAttribute('aria-pressed', state.audio);
  [...$('#qSeg').children].forEach(b => b.setAttribute('aria-pressed', +b.dataset.q === state.quality));
}
togOverlay.addEventListener('click', () => { state.overlay = !state.overlay; syncToggles(); savePrefs(); });
togAudio.addEventListener('click', () => { state.audio = !state.audio; syncToggles(); savePrefs(); });
$('#qSeg').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  state.quality = +b.dataset.q; syncToggles(); savePrefs();
  if(state.recording) toast('Quality changes apply after recording');
});

const shutter = $('#shutter');
function setMode(m){
  if(state.recording) return;
  state.mode = m;
  [...$('#modeSeg').children].forEach(b => b.setAttribute('aria-pressed', b.dataset.m === m));
  shutter.classList.toggle('video', m === 'video');
  shutter.setAttribute('aria-label', m === 'video' ? 'Start recording' : 'Take photo');
}
$('#modeSeg').addEventListener('click', e => { const b = e.target.closest('button'); if(b) setMode(b.dataset.m); });
shutter.addEventListener('click', () => {
  if(!running) return;
  if(state.mode === 'photo') takePhoto();
  else state.recording ? stopRecording() : startRecording();
});

$('#flipBtn').addEventListener('click', async () => {
  const prev = state.facing;
  state.facing = prev === 'user' ? 'environment' : 'user';
  try{ await startCamera(); }
  catch(e){
    toast('Could not switch camera');
    state.facing = prev;
    try{ await startCamera(); }catch(_){}
  }
});

/* ---------- start screen ---------- */
function begin(src){
  state.source = src;
  if(src === 'demo'){ state.mirror = false; $('#flipBtn').hidden = true; }
  $('#start').classList.add('hidden');
  running = true;
}
$('#startBtn').addEventListener('click', async () => {
  $('#startErr').textContent = '';
  try{ await startCamera(); begin('camera'); }
  catch(e){ cameraError(e); }
});
$('#demoBtn').addEventListener('click', () => begin('demo'));
if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
  $('#startErr').textContent = 'This page cannot reach the camera. Camera access needs HTTPS (GitHub Pages provides it) or localhost. You can still try the demo scene.';
  $('#startBtn').disabled = true;
  $('#startBtn').style.opacity = .4;
}
document.addEventListener('visibilitychange', () => {
  if(!document.hidden && state.source === 'camera' && video.paused) video.play().catch(() => {});
});

/* =====================================================================
   CAPTURE
   ===================================================================== */
let cap = null, recorder = null, chunks = [], audioStream = null, recStart = 0, recTimer = null;
const stamp = () => { const d = new Date(); return `${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}-${p2(d.getHours())}${p2(d.getMinutes())}${p2(d.getSeconds())}`; };
const slug = () => LOOKS[state.look].name.toLowerCase().replace(/[^a-z0-9]+/g, '-');

function takePhoto(){
  const f = $('#flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
  out.toBlob(blob => {
    if(!blob){ toast('Could not capture the photo'); return; }
    setCapture({ type:'image', blob, name:`retrocam-${slug()}-${stamp()}.jpg` });
    openPreview();
  }, 'image/jpeg', 0.92);
}

function pickMime(){
  if(!window.MediaRecorder) return '';
  for(const m of ['video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm']){
    if(MediaRecorder.isTypeSupported(m)) return m;
  }
  return '';
}

async function startRecording(){
  if(!window.MediaRecorder || !out.captureStream){ toast('Video recording is not supported in this browser'); return; }
  const vs = out.captureStream(30);
  if(state.audio && state.source === 'camera'){
    try{
      audioStream = await navigator.mediaDevices.getUserMedia({ audio:true });
      audioStream.getAudioTracks().forEach(t => vs.addTrack(t));
    }catch(e){ audioStream = null; toast('Microphone unavailable, recording without sound'); }
  }
  const mime = pickMime();
  try{
    recorder = new MediaRecorder(vs, Object.assign({ videoBitsPerSecond: 8e6 }, mime ? { mimeType: mime } : {}));
  }catch(e){
    try{ recorder = new MediaRecorder(vs); }catch(e2){ toast('Could not start recording'); return; }
  }
  chunks = [];
  recorder.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    const type = (recorder.mimeType || mime || 'video/webm').split(';')[0];
    const blob = new Blob(chunks, { type });
    if(audioStream){ audioStream.getTracks().forEach(t => t.stop()); audioStream = null; }
    const thumb = out.toDataURL('image/jpeg', 0.5);
    setCapture({ type:'video', blob, thumb, name:`retrocam-${slug()}-${stamp()}.${type.includes('mp4') ? 'mp4' : 'webm'}` });
    openPreview();
  };
  recorder.start(250);
  state.recording = true;
  shutter.classList.add('recording');
  shutter.setAttribute('aria-label', 'Stop recording');
  $('#recBadge').classList.remove('hidden');
  recStart = performance.now();
  recTimer = setInterval(() => {
    const s = Math.floor((performance.now() - recStart)/1000);
    $('#recTime').textContent = `${p2(Math.floor(s/60))}:${p2(s%60)}`;
  }, 250);
  $('#recTime').textContent = '00:00';
}
function stopRecording(){
  if(recorder && recorder.state !== 'inactive') recorder.stop();
  state.recording = false;
  shutter.classList.remove('recording');
  shutter.setAttribute('aria-label', 'Start recording');
  $('#recBadge').classList.add('hidden');
  clearInterval(recTimer);
}

function setCapture(c){
  if(cap && cap.url) URL.revokeObjectURL(cap.url);
  c.url = URL.createObjectURL(c.blob);
  cap = c;
  const th = $('#thumb');
  th.classList.remove('hidden');
  th.style.backgroundImage = `url("${c.type === 'image' ? c.url : c.thumb}")`;
}
function openPreview(){
  if(!cap) return;
  const box = $('#pvMedia');
  box.innerHTML = '';
  let el;
  if(cap.type === 'image'){ el = document.createElement('img'); el.src = cap.url; el.alt = 'Captured photo'; }
  else{ el = document.createElement('video'); el.src = cap.url; el.controls = true; el.loop = true; el.autoplay = true; el.setAttribute('playsinline', ''); }
  box.appendChild(el);
  $('#preview').classList.remove('hidden');
}
function closePreview(){
  $('#preview').classList.add('hidden');
  $('#pvMedia').innerHTML = '';
}
function download(){
  if(!cap) return;
  const a = document.createElement('a');
  a.href = cap.url; a.download = cap.name;
  document.body.appendChild(a); a.click(); a.remove();
}
async function saveShare(){
  if(!cap) return;
  const file = new File([cap.blob], cap.name, { type: cap.blob.type });
  if(navigator.canShare && navigator.canShare({ files:[file] })){
    try{ await navigator.share({ files:[file], title:'RetroCam' }); return; }
    catch(e){ if(e && e.name === 'AbortError') return; }
  }
  download();
}
$('#thumb').addEventListener('click', openPreview);
$('#pvClose').addEventListener('click', closePreview);
$('#pvDl').addEventListener('click', download);
$('#pvSave').addEventListener('click', saveShare);

/* keyboard (desktop) */
document.addEventListener('keydown', e => {
  if(!running || !$('#preview').classList.contains('hidden')) return;
  if(e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
  if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); shutter.click(); }
  else if(e.key === 'ArrowRight') selectLook((state.look + 1) % LOOKS.length);
  else if(e.key === 'ArrowLeft') selectLook((state.look + LOOKS.length - 1) % LOOKS.length);
});

/* =====================================================================
   INIT
   ===================================================================== */
loadPrefs();
syncToggles();
selectLook(state.look);
setMode('photo');
if(window.innerWidth >= 900) setPanel(true);
if(document.fonts && document.fonts.load){ document.fonts.load('40px VT323').catch(() => {}); }
requestAnimationFrame(loop);
})();
</script>
