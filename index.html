<style>
:root{
  --body:#1b1917;
  --bone:#e8e0cf;
  --dim:#a39b8b;
  --lcd:#ffb43a;
  --line:rgba(232,224,207,.14);
  --f-ui:'Chakra Petch', 'Trebuchet MS', system-ui, sans-serif;
  --f-display:'Unbounded', 'Arial Black', system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--body);color:var(--bone);font-family:var(--f-ui)}
body{position:fixed;inset:0;overflow-y:auto;display:flex}
.start{
  flex:1;display:flex;flex-direction:column;justify-content:center;
  padding:32px calc(28px + env(safe-area-inset-left,0px)) calc(32px + env(safe-area-inset-bottom,0px));
  background:radial-gradient(120% 70% at 15% 0%,#3a2a1c 0%,var(--body) 62%);
}
.maker{display:flex;align-items:center;gap:14px;margin-bottom:28px;width:fit-content;color:var(--bone);text-decoration:none}
.maker img{width:84px;height:84px;border-radius:50%;display:block;flex:none;border:2px solid var(--lcd)}
.maker-t{display:flex;flex-direction:column;gap:5px;font-size:16px;font-weight:600}
.maker-t .ig{display:inline-flex;align-items:center;gap:6px;color:var(--lcd);font-size:14px;font-weight:500}
.maker:hover .ig span{text-decoration:underline}
.bars{display:flex;height:14px;width:min(340px,72vw);margin-bottom:26px}
.bars i{flex:1;display:block}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(52px,15vw,112px);line-height:.92;margin:0 0 18px;letter-spacing:-.02em}
h1 span{color:transparent;-webkit-text-stroke:2px var(--lcd)}
p{max-width:34ch;margin:0 0 30px;color:var(--dim);font-size:16px;line-height:1.5}
.soon{
  display:inline-flex;align-items:center;gap:10px;
  background:transparent;color:var(--lcd);border:1.5px solid var(--lcd);
  border-radius:12px;padding:14px 22px;font-weight:600;font-size:17px;
  font-family:var(--f-ui);cursor:default;width:fit-content;
}
.soon i{width:9px;height:9px;border-radius:50%;background:var(--lcd);display:block;box-shadow:0 0 8px var(--lcd);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media (max-height:720px){ .maker img{width:64px;height:64px} .maker{margin-bottom:16px} .bars{margin-bottom:16px} }
</style>
</head>
